version: '3.8'

# Docker Compose con imágenes pre-construidas para el despliegue más rápido
# Uso: docker compose -f docker-compose.prebuilt.yml up -d

services:
  backend:
    image: mafercho/kmeans-backend:latest
    container_name: kmeans-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    image: mafercho/kmeans-frontend:latest
    container_name: kmeans-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
